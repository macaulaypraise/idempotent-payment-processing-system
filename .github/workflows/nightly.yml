name: Nightly verification

# Two jobs, both part of the five-night exit gate (docs/verification.md):
#   verify  the long, randomized state-machine profile and its self-test
#   faults  the whole stack behind Toxiproxy: seeded scenarios of network
#           faults, process kills and crash points, and the fault self-test
# A failure uploads the failing history; the summaries record the numbers
# the README quotes.
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC
  workflow_dispatch:
    inputs:
      examples:
        description: "Histories to generate"
        default: "300"
      fault_scenarios:
        description: "Fault scenarios to run"
        default: "8"

jobs:
  verify:
    name: State machine (nightly profile) + self-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payments_test
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/payments_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/payments_test
      TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      LOG_LEVEL: ERROR
      VERIFY_PROFILE: nightly
      VERIFY_EXAMPLES: ${{ github.event.inputs.examples || '300' }}
      VERIFY_HISTORY_DIR: .verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      # Past failures are replayed first: Hypothesis keeps them here
      - name: Cache Hypothesis example database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-${{ github.run_id }}
          restore-keys: hypothesis-
      - run: poetry install --no-interaction
      - name: Run the harness
        run: |
          set -o pipefail
          poetry run pytest tests/verification -s --no-cov 2>&1 | tee verify.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## Nightly verification"
            echo '```'
            grep -E '^harness:|^  |planted bug|passed|failed' verify.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the failing history
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-history-${{ github.run_id }}
          path: |
            .verify/
            verify.log
          retention-days: 14

  faults:
    name: Fault layer (Toxiproxy scenarios) + self-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FAULT_SCENARIOS: ${{ github.event.inputs.fault_scenarios || '8' }}
      FAULT_SECONDS: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --no-interaction
      - name: Run the fault layer
        run: |
          set -o pipefail
          make verify-faults 2>&1 | tee faults.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## Fault layer"
            echo '```'
            grep -E '^faults:|^scenario|^fault self-test|^  ' faults.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.faults.yml logs --no-color --timestamps > faults-compose.log || true
      - name: Upload the failing scenario
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: faults-${{ github.run_id }}
          path: |
            .verify-faults/
            faults.log
            faults-compose.log
          retention-days: 14
      - name: Remove the fault stack
        if: always()
        run: docker compose -f docker-compose.faults.yml down -v || true
